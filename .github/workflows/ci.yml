name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

  validate-and-install:
    name: Validate Skills & Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency (plugin.json ↔ CHANGELOG)
        run: |
          PLUGIN_VERSION=$(sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          CHANGELOG_VERSION=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          echo "plugin.json: $PLUGIN_VERSION | CHANGELOG: $CHANGELOG_VERSION"
          if [ "$PLUGIN_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "❌ plugin.json version and latest CHANGELOG entry must match"
            exit 1
          fi
          echo "✔ Versions are consistent"

      - name: Validate skill files
        run: make validate

      - name: Validate example TOON specs
        run: make validate-specs

      - name: Spec validator regression tests
        run: make test

      - name: Validate install script (dry run)
        run: |
          mkdir -p /tmp/test-spring /tmp/test-dotnet
          bash scripts/install.sh spring-boot /tmp/test-spring agent "$(pwd)"
          bash scripts/install.sh dotnet      /tmp/test-dotnet agent "$(pwd)"
          echo "✔ Install scripts work correctly"

      - name: Check required files in install output
        run: |
          COMMON_REQUIRED=(
            SKILLS.md
            context.md
            architecture.md
            decisions.md
            conventions.md
            runbook.md
            glossary.md
            backlog_rules.md
            skills/shared/api-design/SKILL.md
            skills/shared/database/SKILL.md
            skills/shared/security/SKILL.md
            skills/shared/observability/SKILL.md
            skills/shared/error-handling/SKILL.md
            skills/shared/bootstrap/SKILL.md
            skills/shared/refactor/SKILL.md
            skills/shared/anti-invention/SKILL.md
            skills/shared/pattern-analysis/SKILL.md
            skills/shared/gap-analysis/SKILL.md
            skills/shared/spec-validation/SKILL.md
            skills/shared/dor/SKILL.md
            skills/shared/dod/SKILL.md
          )
          FAILED=0
          for stack in spring-boot dotnet; do
            case "$stack" in
              spring-boot) target=/tmp/test-spring ;;
              dotnet)      target=/tmp/test-dotnet ;;
            esac
            for f in "${COMMON_REQUIRED[@]}" "skills/$stack/SKILL.md" "skills/$stack/testing.md"; do
              [ -f "$target/.agent/$f" ] || { echo "❌ Missing ($stack): $f"; FAILED=1; }
            done
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "✔ All required files present after install"

      - name: Re-install keeps project-owned files
        run: |
          echo "MY OVERRIDE" >> /tmp/test-dotnet/.agent/SKILLS.md
          echo "MY CONTEXT"  >> /tmp/test-dotnet/.agent/context.md
          echo "STALE"       >> /tmp/test-dotnet/.agent/skills/shared/dod/SKILL.md
          bash scripts/install.sh dotnet /tmp/test-dotnet agent "$(pwd)"
          grep -q "MY OVERRIDE" /tmp/test-dotnet/.agent/SKILLS.md || { echo "❌ SKILLS.md overrides lost"; exit 1; }
          grep -q "MY CONTEXT"  /tmp/test-dotnet/.agent/context.md || { echo "❌ context.md lost"; exit 1; }
          if grep -q "STALE" /tmp/test-dotnet/.agent/skills/shared/dod/SKILL.md; then echo "❌ skills not refreshed"; exit 1; fi
          echo "✔ Re-install keeps SKILLS.md and context docs, refreshes skills"

      - name: Verify skill count
        run: |
          EXPECTED=17
          ACTUAL=$(find skills -name "*.md" | wc -l)
          echo "Skills found: $ACTUAL (expected: $EXPECTED)"
          [ "$ACTUAL" -ge "$EXPECTED" ] || { echo "❌ Expected at least $EXPECTED skill files"; exit 1; }
          echo "✔ Skill count OK"

  install-powershell:
    name: PowerShell installer (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }   # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }
          - { os: ubuntu-latest,  shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Keep LF line endings (as the README's clone command does)
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: install.ps1 is ASCII-only (Windows PowerShell 5.1 reads BOM-less scripts as ANSI)
        run: |
          if ([IO.File]::ReadAllBytes("$PWD/scripts/install.ps1") | Where-Object { $_ -gt 127 }) {
            throw 'scripts/install.ps1 must contain only ASCII characters'
          }

      - name: install.ps1 output matches install.sh
        run: |
          $bash = if ($env:OS -eq 'Windows_NT') { "$env:ProgramFiles\Git\bin\bash.exe" } else { 'bash' }
          function Get-Tree([string] $Dir) {
            $root = (Resolve-Path $Dir).Path
            Get-ChildItem $root -Recurse -File -Force | ForEach-Object {
              '{0} {1}' -f $_.FullName.Substring($root.Length + 1).Replace('\', '/'), (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            } | Sort-Object
          }
          foreach ($stack in 'spring-boot', 'dotnet') {
            foreach ($format in 'agent', 'kiro') {
              $ps = "out/ps-$stack-$format"; $sh = "out/sh-$stack-$format"
              New-Item -ItemType Directory -Force $ps, $sh | Out-Null
              & ./scripts/install.ps1 -Stack $stack -Target $ps -Format $format
              & $bash scripts/install.sh $stack $sh $format .
              if ($LASTEXITCODE -ne 0) { throw "install.sh failed for $stack/$format" }
              $diff = Compare-Object @(Get-Tree $sh) @(Get-Tree $ps)
              if ($diff) {
                $diff | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
                git --no-pager diff --no-index $sh $ps
                throw "install.ps1 and install.sh differ for $stack/$format"
              }
              Write-Host "OK: $stack/$format identical"
            }
          }

      - name: install.ps1 works as a one-line scriptblock (remote install form)
        run: |
          New-Item -ItemType Directory -Force out/scriptblock | Out-Null
          & ([scriptblock]::Create((Get-Content -Raw scripts/install.ps1))) -Stack dotnet -Target out/scriptblock -Source .
          if (-not (Test-Path out/scriptblock/.agent/SKILLS.md)) { throw 'scriptblock install produced no .agent/SKILLS.md' }

      - name: install.ps1 re-install keeps project-owned files
        run: |
          $t = 'out/ps-dotnet-agent/.agent'
          Add-Content "$t/SKILLS.md" 'MY OVERRIDE'
          Add-Content "$t/context.md" 'MY CONTEXT'
          Add-Content "$t/skills/shared/dod/SKILL.md" 'STALE'
          & ./scripts/install.ps1 -Stack dotnet -Target out/ps-dotnet-agent
          if (-not (Select-String -LiteralPath "$t/SKILLS.md" -Pattern 'MY OVERRIDE' -SimpleMatch -Quiet)) { throw 'SKILLS.md overrides lost' }
          if (-not (Select-String -LiteralPath "$t/context.md" -Pattern 'MY CONTEXT' -SimpleMatch -Quiet)) { throw 'context.md lost' }
          if (Select-String -LiteralPath "$t/skills/shared/dod/SKILL.md" -Pattern 'STALE' -SimpleMatch -Quiet) { throw 'skills not refreshed' }

      - name: install.ps1 rejects an unknown stack
        run: |
          New-Item -ItemType Directory -Force out/bad | Out-Null
          $failed = $false
          try { & ./scripts/install.ps1 -Stack nope -Target out/bad } catch { $failed = $true; Write-Host "Rejected as expected: $_" }
          if (-not $failed) { throw 'install.ps1 accepted an unknown stack' }
